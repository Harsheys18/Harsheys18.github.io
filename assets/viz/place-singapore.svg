<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="An illustration of Singapore after dark: lit supertree-like structures, a bay of glass towers, and their reflection in the water.">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13224a"/><stop offset=".55" stop-color="#3b3f7d"/><stop offset="1" stop-color="#7d5a94"/>
    </linearGradient>
  </defs>
  <style>
    .lit { animation: lit 3s ease-in-out infinite; }
    .l2 { animation-delay: .5s; } .l3 { animation-delay: 1s; } .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 2s; }
    @keyframes lit { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .ripple { animation: rp 6s ease-in-out infinite; }
    @keyframes rp { 0%,100% { transform: translateX(0); opacity: .4; } 50% { transform: translateX(-8px); opacity: .7; } }
  </style>

  <rect width="400" height="260" fill="url(#sSky)"/>
  <g fill="#ffffff" opacity=".7">
    <circle class="lit" cx="44" cy="34" r="1.5"/><circle class="lit l3" cx="112" cy="22" r="1.5"/>
    <circle class="lit l2" cx="208" cy="40" r="1.5"/><circle class="lit l4" cx="298" cy="26" r="1.5"/>
    <circle class="lit l5" cx="360" cy="48" r="1.5"/>
  </g>

  <!-- towers -->
  <g fill="#1b2a56">
    <rect x="252" y="96" width="24" height="94" rx="3"/>
    <rect x="284" y="78" width="24" height="112" rx="3"/>
    <rect x="316" y="104" width="24" height="86" rx="3"/>
    <rect x="248" y="66" width="96" height="14" rx="7"/>
    <rect x="16" y="130" width="22" height="60" rx="2"/>
    <rect x="42" y="148" width="18" height="42" rx="2"/>
  </g>
  <g fill="#6fe3d6">
    <rect class="lit" x="258" y="112" width="4" height="5"/><rect class="lit l2" x="266" y="128" width="4" height="5"/>
    <rect class="lit l3" x="290" y="96" width="4" height="5"/><rect class="lit l4" x="298" y="118" width="4" height="5"/>
    <rect class="lit l5" x="322" y="124" width="4" height="5"/><rect class="lit l2" x="330" y="146" width="4" height="5"/>
  </g>

  <!-- supertrees -->
  <g>
    <path d="M104 190 V116" stroke="#2c4a3e" stroke-width="7" stroke-linecap="round"/>
    <path d="M104 118 q-34 -8 -44 18 q40 -4 44 -18 z" fill="#3f7f5e"/>
    <path d="M104 118 q34 -8 44 18 q-40 -4 -44 -18 z" fill="#4d9970"/>
    <circle class="lit" cx="76" cy="126" r="3" fill="#ffb86b"/>
    <circle class="lit l3" cx="132" cy="128" r="3" fill="#ff9f6b"/>

    <path d="M170 190 V142" stroke="#2c4a3e" stroke-width="6" stroke-linecap="round"/>
    <path d="M170 144 q-26 -6 -34 14 q30 -3 34 -14 z" fill="#3f7f5e"/>
    <path d="M170 144 q26 -6 34 14 q-30 -3 -34 -14 z" fill="#4d9970"/>
    <circle class="lit l2" cx="148" cy="152" r="2.5" fill="#ffb86b"/>

    <path d="M212 190 V128" stroke="#2c4a3e" stroke-width="6" stroke-linecap="round"/>
    <path d="M212 130 q-28 -7 -36 15 q32 -3 36 -15 z" fill="#46896a"/>
    <path d="M212 130 q28 -7 36 15 q-32 -3 -36 -15 z" fill="#57a97e"/>
    <circle class="lit l4" cx="236" cy="140" r="2.5" fill="#ff9f6b"/>
  </g>

  <!-- water -->
  <rect y="190" width="400" height="70" fill="#101c3e"/>
  <g class="ripple" fill="#6fe3d6" opacity=".5">
    <rect x="256" y="202" width="46" height="3" rx="1.5"/>
    <rect x="286" y="216" width="58" height="3" rx="1.5"/>
    <rect x="96" y="208" width="40" height="3" rx="1.5"/>
    <rect x="180" y="228" width="52" height="3" rx="1.5"/>
  </g>
</svg>
