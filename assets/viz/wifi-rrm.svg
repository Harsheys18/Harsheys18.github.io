<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Client-centric Wi-Fi radio resource management with safe reinforcement learning: a fast loop mitigates interference between access points while a slower Lagrangian-constrained TD3 loop tunes transmit power and bandwidth for quality of experience under safety constraints.">
  <style>
    .bg { fill: #f2f8fd; }
    .panel { fill: #ffffff; stroke: #bcdcf2; stroke-width: 1.5; }
    .lbl { font: 600 12px Inter, system-ui, sans-serif; fill: #10305c; }
    .sub { font: 500 10px Inter, system-ui, sans-serif; fill: #6e7d96; }
    .cap { font: 600 11px Inter, system-ui, sans-serif; fill: #1878b8; letter-spacing: .08em; }
    .mono { font: 600 10px "JetBrains Mono", ui-monospace, monospace; fill: #1878b8; }
    .wave { animation: wv 2.4s ease-out infinite; transform-box: view-box; }
    .w2 { animation-delay: .6s; } .w3 { animation-delay: 1.2s; }
    @keyframes wv { 0% { opacity: .75; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.35); } }
    .apA { transform-origin: 106px 118px; }
    .apB { transform-origin: 250px 118px; }
    .fast { animation: fast 1.4s ease-in-out infinite; }
    @keyframes fast { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .slow { animation: slow 5s ease-in-out infinite; }
    @keyframes slow { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .pw { transform-box: view-box; transform-origin: left center; animation: pw 5s ease-in-out infinite; }
    @keyframes pw { 0%,100% { transform: scaleX(.9); } 50% { transform: scaleX(.52); } }
    .bwb { transform-box: view-box; transform-origin: left center; animation: bwb 5s ease-in-out infinite; }
    @keyframes bwb { 0%,100% { transform: scaleX(.45); } 50% { transform: scaleX(.85); } }
    .overlap { animation: ov 5s ease-in-out infinite; }
    @keyframes ov { 0%,100% { opacity: .5; } 50% { opacity: .08; } }
  </style>

  <rect class="bg" width="520" height="340" rx="10"/>
  <text class="cap" x="24" y="30">TWO TIMESCALES, ONE SAFETY BUDGET</text>

  <!-- RF scene -->
  <rect class="panel" x="24" y="46" width="300" height="200" rx="10"/>

  <circle class="overlap" cx="178" cy="118" r="34" fill="#e8705a" opacity=".4"/>
  <text class="sub" x="150" y="166" fill="#c0503a">interference</text>

  <g>
    <circle class="wave apA" cx="106" cy="118" r="34" fill="none" stroke="#2b95d6" stroke-width="2"/>
    <circle class="wave w2 apA" cx="106" cy="118" r="34" fill="none" stroke="#2b95d6" stroke-width="2"/>
    <circle class="wave w3 apA" cx="106" cy="118" r="34" fill="none" stroke="#2b95d6" stroke-width="2"/>
    <rect x="94" y="108" width="24" height="16" rx="3" fill="#10305c"/>
    <path d="M106 108 v-10" stroke="#10305c" stroke-width="2"/>
    <text class="sub" x="92" y="140">AP 1</text>
  </g>
  <g>
    <circle class="wave apB" cx="250" cy="118" r="34" fill="none" stroke="#8ec7e9" stroke-width="2"/>
    <circle class="wave w2 apB" cx="250" cy="118" r="34" fill="none" stroke="#8ec7e9" stroke-width="2"/>
    <rect x="238" y="108" width="24" height="16" rx="3" fill="#10305c"/>
    <path d="M250 108 v-10" stroke="#10305c" stroke-width="2"/>
    <text class="sub" x="236" y="140">AP 2</text>
  </g>

  <!-- clients -->
  <g fill="#10305c">
    <rect x="68" y="192" width="14" height="22" rx="3"/>
    <rect x="128" y="200" width="14" height="22" rx="3"/>
    <rect x="200" y="192" width="14" height="22" rx="3"/>
    <rect x="262" y="202" width="14" height="22" rx="3"/>
  </g>
  <text class="sub" x="40" y="236">clients &#8212; optimise their experience, not the AP&#8217;s</text>

  <!-- controls -->
  <rect class="panel" x="340" y="46" width="156" height="200" rx="10"/>
  <text class="lbl" x="356" y="70">actions</text>
  <text class="sub" x="356" y="94">transmit power</text>
  <rect x="356" y="100" width="122" height="12" rx="6" fill="#eef7fd" stroke="#bcdcf2"/>
  <rect class="pw" x="356" y="100" width="122" height="12" rx="6" fill="#2b95d6"/>
  <text class="sub" x="356" y="140">bandwidth</text>
  <rect x="356" y="146" width="122" height="12" rx="6" fill="#eef7fd" stroke="#bcdcf2"/>
  <rect class="bwb" x="356" y="146" width="122" height="12" rx="6" fill="#10305c"/>
  <text class="lbl" x="356" y="188">objective</text>
  <text class="sub" x="356" y="206">max QoE</text>
  <text class="sub" x="356" y="224">s.t. cost &#8804; limit</text>

  <!-- timescales -->
  <rect class="panel" x="24" y="262" width="472" height="56" rx="10"/>
  <g class="fast">
    <rect x="40" y="274" width="180" height="32" rx="7" fill="#eef7fd" stroke="#2b95d6"/>
    <text class="sub" x="54" y="288" fill="#1878b8">fast loop</text>
    <text class="sub" x="54" y="302">interference mitigation</text>
  </g>
  <g class="slow">
    <rect x="240" y="274" width="240" height="32" rx="7" fill="#eef7fd" stroke="#10305c"/>
    <text class="sub" x="254" y="288" fill="#10305c">slow loop</text>
    <text class="mono" x="254" y="302">Lagrangian-constrained TD3</text>
  </g>
</svg>
