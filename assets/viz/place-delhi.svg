<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="An illustration of Delhi: a sandstone minaret and domed pavilions under a warm afternoon sky, with glass office towers rising in the distance.">
  <defs>
    <linearGradient id="dSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc0e8"/><stop offset=".6" stop-color="#f3d7a8"/><stop offset="1" stop-color="#f0bd85"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c76a44"/><stop offset=".5" stop-color="#e08a5c"/><stop offset="1" stop-color="#b85c3a"/>
    </linearGradient>
  </defs>
  <style>
    .bird { animation: fly 9s linear infinite; }
    .b2 { animation-delay: 3s; } .b3 { animation-delay: 6s; }
    @keyframes fly { 0% { transform: translate(-40px, 10px); opacity: 0; } 12%,84% { opacity: .75; } 100% { transform: translate(440px, -24px); opacity: 0; } }
    .haze { animation: hz 7s ease-in-out infinite; }
    @keyframes hz { 0%,100% { opacity: .18; } 50% { opacity: .38; } }
  </style>

  <rect width="400" height="260" fill="url(#dSky)"/>
  <circle cx="82" cy="56" r="22" fill="#fff0cc" opacity=".8"/>

  <!-- distant towers -->
  <g fill="#9fb4c8" opacity=".75">
    <rect x="280" y="120" width="22" height="80"/>
    <rect x="308" y="98" width="18" height="102"/>
    <rect x="332" y="130" width="26" height="70"/>
    <rect x="364" y="112" width="18" height="88"/>
  </g>
  <rect class="haze" x="260" y="96" width="140" height="104" fill="#ffffff"/>

  <!-- minaret -->
  <g>
    <path d="M150 200 L162 62 L186 62 L198 200 z" fill="url(#stone)"/>
    <path d="M158 148 H190 M154 108 H194 M163 84 H185" stroke="#9c4a2c" stroke-width="3"/>
    <path d="M156 152 q18 12 36 0 v-6 q-18 12 -36 0 z" fill="#f0a97c"/>
    <path d="M161 112 q13 10 26 0 v-6 q-13 10 -26 0 z" fill="#f0a97c"/>
    <path d="M162 62 q12 -20 24 0 z" fill="#e8b27e"/>
    <path d="M174 42 v-10" stroke="#9c4a2c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- pavilions -->
  <g fill="#d9885d">
    <rect x="52" y="160" width="62" height="40"/>
    <path d="M52 160 q31 -30 62 0 z" fill="#c5714a"/>
    <rect x="78" y="128" width="10" height="16" rx="4" fill="#c5714a"/>
    <rect x="228" y="172" width="44" height="28"/>
    <path d="M228 172 q22 -22 44 0 z" fill="#c5714a"/>
  </g>
  <g fill="#8c4327">
    <rect x="62" y="176" width="10" height="24" rx="4"/>
    <rect x="80" y="176" width="10" height="24" rx="4"/>
    <rect x="98" y="176" width="10" height="24" rx="4"/>
    <rect x="240" y="184" width="8" height="16" rx="3"/>
    <rect x="254" y="184" width="8" height="16" rx="3"/>
  </g>

  <!-- ground -->
  <rect y="200" width="400" height="60" fill="#c99a63"/>
  <path d="M0 200 H400" stroke="#a87c4a" stroke-width="3"/>
  <g fill="#3f7a4e">
    <ellipse cx="34" cy="214" rx="26" ry="12"/>
    <ellipse cx="330" cy="220" rx="34" ry="14"/>
    <ellipse cx="206" cy="232" rx="22" ry="10"/>
  </g>

  <!-- birds -->
  <g class="bird" stroke="#5b4630" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M0 30 q6 -6 12 0 q6 -6 12 0"/>
  </g>
  <g class="bird b2" stroke="#5b4630" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M0 58 q5 -5 10 0 q5 -5 10 0"/>
  </g>
  <g class="bird b3" stroke="#5b4630" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M0 18 q5 -5 10 0 q5 -5 10 0"/>
  </g>
</svg>
