<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="An illustration of Mumbai at dusk: the cable-stayed sea link over the water, a line of towers behind it, and palm trees along the shore.">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5f9e"/><stop offset=".45" stop-color="#7fa8d6"/><stop offset=".78" stop-color="#f4b183"/><stop offset="1" stop-color="#f6cf9e"/>
    </linearGradient>
    <linearGradient id="mSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e5a8a"/><stop offset="1" stop-color="#0f3358"/>
    </linearGradient>
  </defs>
  <style>
    .glow { animation: gl 4s ease-in-out infinite; }
    .g2 { animation-delay: 1.3s; } .g3 { animation-delay: 2.6s; }
    @keyframes gl { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    .shimmer { animation: sh 5s ease-in-out infinite; }
    @keyframes sh { 0%,100% { opacity: .25; transform: translateX(0); } 50% { opacity: .55; transform: translateX(10px); } }
  </style>

  <rect width="400" height="260" fill="url(#mSky)"/>
  <circle cx="318" cy="160" r="26" fill="#ffd9a0" opacity=".9"/>

  <!-- skyline -->
  <g fill="#153c68">
    <rect x="16" y="120" width="26" height="60"/>
    <rect x="46" y="98" width="20" height="82"/>
    <rect x="70" y="132" width="30" height="48"/>
    <rect x="104" y="86" width="22" height="94"/>
    <rect x="130" y="116" width="28" height="64"/>
    <rect x="162" y="104" width="18" height="76"/>
    <rect x="352" y="112" width="24" height="68"/>
    <rect x="380" y="134" width="20" height="46"/>
  </g>
  <g fill="#ffd9a0">
    <rect class="glow" x="22" y="130" width="5" height="6"/>
    <rect class="glow g2" x="32" y="146" width="5" height="6"/>
    <rect class="glow g3" x="52" y="112" width="5" height="6"/>
    <rect class="glow g2" x="110" y="102" width="5" height="6"/>
    <rect class="glow" x="138" y="130" width="5" height="6"/>
    <rect class="glow g3" x="358" y="126" width="5" height="6"/>
  </g>

  <!-- sea -->
  <rect y="180" width="400" height="80" fill="url(#mSea)"/>

  <!-- sea link -->
  <g>
    <path d="M0 186 H400" stroke="#0b2748" stroke-width="7"/>
    <path d="M190 186 V128 M256 186 V138" stroke="#e8eef6" stroke-width="4" stroke-linecap="round"/>
    <path d="M190 132 L150 186 M190 132 L230 186 M190 138 L164 186 M190 138 L216 186" stroke="#e8eef6" stroke-width="1.5" opacity=".85"/>
    <path d="M256 142 L222 186 M256 142 L290 186 M256 148 L236 186 M256 148 L276 186" stroke="#e8eef6" stroke-width="1.5" opacity=".85"/>
  </g>

  <!-- reflections -->
  <g class="shimmer" fill="#ffd9a0">
    <rect x="300" y="200" width="40" height="3" rx="1.5"/>
    <rect x="292" y="212" width="56" height="3" rx="1.5"/>
    <rect x="306" y="224" width="30" height="3" rx="1.5"/>
  </g>

  <!-- palms -->
  <g stroke="#0b2748" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 260 q-4 -30 4 -44"/>
    <path d="M44 216 q-16 -6 -22 4 M44 216 q16 -6 22 4 M44 216 q-6 -16 -18 -16 M44 216 q6 -16 18 -16"/>
    <path d="M78 260 q-3 -22 3 -32"/>
    <path d="M81 228 q-12 -5 -17 3 M81 228 q12 -5 17 3 M81 228 q-4 -12 -14 -12"/>
  </g>
</svg>
