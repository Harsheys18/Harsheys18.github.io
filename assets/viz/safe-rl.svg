<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Safe reinforcement learning: an agent sweeps LIDAR rays through a continuous-control arena, and a constrained policy-gradient update keeps the accumulated cost under a hard safety budget instead of only maximising return.">
  <style>
    .bg { fill: #f2f8fd; }
    .arena { fill: #ffffff; stroke: #bcdcf2; stroke-width: 1.5; }
    .lbl { font: 600 12px Inter, system-ui, sans-serif; fill: #10305c; }
    .sub { font: 500 10px Inter, system-ui, sans-serif; fill: #6e7d96; }
    .cap { font: 600 11px Inter, system-ui, sans-serif; fill: #1878b8; letter-spacing: .08em; }
    .hazard { fill: #e8705a; opacity: .16; stroke: #e8705a; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .sweep { transform-box: view-box; transform-origin: 150px 176px; animation: sweep 3.6s ease-in-out infinite; }
    @keyframes sweep { 0%,100% { transform: rotate(-52deg); } 50% { transform: rotate(52deg); } }
    .agent { transform-box: view-box; animation: walk 6s ease-in-out infinite; }
    @keyframes walk { 0%,100% { transform: translate(0,0); } 35% { transform: translate(44px,-22px); } 70% { transform: translate(18px,26px); } }
    .fill { animation: budget 4s ease-in-out infinite; }
    @keyframes budget { 0% { width: 18px; } 55% { width: 92px; } 70% { width: 96px; } 100% { width: 30px; } }
    .clampflash { animation: flash 4s ease-in-out infinite; }
    @keyframes flash { 0%,50%,80%,100% { opacity: 0; } 62%,72% { opacity: 1; } }
  </style>

  <rect class="bg" width="520" height="340" rx="10"/>
  <text class="cap" x="24" y="30">CONSTRAINED POLICY GRADIENT</text>

  <!-- arena -->
  <rect class="arena" x="24" y="52" width="264" height="248" rx="10"/>

  <!-- hazards -->
  <circle class="hazard" cx="216" cy="110" r="34"/>
  <circle class="hazard" cx="92" cy="252" r="28"/>
  <text class="sub" x="192" y="114" fill="#c0503a">hazard</text>

  <!-- goal -->
  <circle cx="246" cy="248" r="13" fill="#24a89b" opacity=".2"/>
  <circle cx="246" cy="248" r="6" fill="#24a89b"/>
  <text class="sub" x="222" y="278" fill="#17857a">goal</text>

  <!-- agent + lidar -->
  <g class="agent">
    <g class="sweep">
      <path d="M150 176 L150 96" stroke="#2b95d6" stroke-width="1.5" opacity=".85"/>
      <path d="M150 176 L108 108" stroke="#2b95d6" stroke-width="1.5" opacity=".5"/>
      <path d="M150 176 L192 108" stroke="#2b95d6" stroke-width="1.5" opacity=".5"/>
      <path d="M150 176 L82 140" stroke="#2b95d6" stroke-width="1.5" opacity=".3"/>
      <path d="M150 176 L218 140" stroke="#2b95d6" stroke-width="1.5" opacity=".3"/>
    </g>
    <circle cx="150" cy="176" r="11" fill="#10305c"/>
    <circle cx="150" cy="176" r="4" fill="#8ec7e9"/>
  </g>
  <text class="sub" x="36" y="294">LIDAR + hazard heuristics &#183; 60-d state</text>

  <!-- right panel: objective -->
  <g>
    <rect class="arena" x="312" y="52" width="184" height="108" rx="10"/>
    <text class="lbl" x="328" y="78">maximise return</text>
    <path d="M328 96 q22 -18 44 -6 t44 -22" fill="none" stroke="#2b95d6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M416 68 l0 32" stroke="#dcecf9" stroke-width="1"/>
    <text class="sub" x="328" y="126">PPO / TRPO update</text>
    <text class="sub" x="328" y="144">subject to a cost constraint</text>
  </g>

  <!-- cost budget bar -->
  <g>
    <rect class="arena" x="312" y="176" width="184" height="124" rx="10"/>
    <text class="lbl" x="328" y="202">cost budget</text>
    <rect x="328" y="216" width="140" height="18" rx="9" fill="#eef7fd" stroke="#bcdcf2"/>
    <rect class="fill" x="328" y="216" width="18" height="18" rx="9" fill="#2b95d6"/>
    <path d="M440 210 v30" stroke="#e8705a" stroke-width="2.5" stroke-linecap="round"/>
    <text class="sub" x="424" y="254" fill="#c0503a">limit</text>
    <g class="clampflash">
      <rect x="328" y="268" width="152" height="22" rx="7" fill="#fdeeea" stroke="#e8705a"/>
      <text class="sub" x="340" y="283" fill="#c0503a">constraint active &#8594; step clipped</text>
    </g>
  </g>
</svg>
