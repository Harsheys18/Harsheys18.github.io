<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="An illustration of a river town at sunrise: stepped ghats leading down to a wide river, small boats on the water, and a temple spire catching the first light.">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e86bd"/><stop offset=".5" stop-color="#f2c08a"/><stop offset="1" stop-color="#f7ddb4"/>
    </linearGradient>
    <linearGradient id="pRiv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a6a"/><stop offset="1" stop-color="#8d6c4c"/>
    </linearGradient>
  </defs>
  <style>
    .boat { animation: float 5s ease-in-out infinite; }
    .bt2 { animation-delay: 1.6s; }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-3px); } }
    .sun { animation: rise 8s ease-in-out infinite; }
    @keyframes rise { 0%,100% { opacity: .8; transform: translateY(4px); } 50% { opacity: 1; transform: translateY(-4px); } }
    .ripple { animation: rp 6s ease-in-out infinite; }
    @keyframes rp { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  </style>

  <rect width="400" height="260" fill="url(#pSky)"/>
  <circle class="sun" cx="286" cy="86" r="28" fill="#ffd79a"/>
  <circle class="sun" cx="286" cy="86" r="42" fill="#ffd79a" opacity=".25"/>

  <!-- far bank -->
  <rect y="126" width="400" height="14" fill="#8fa87d" opacity=".7"/>

  <!-- temple -->
  <g>
    <path d="M62 132 L80 64 L98 132 z" fill="#e0754f"/>
    <path d="M70 100 H90" stroke="#b5502f" stroke-width="2.5"/>
    <path d="M66 116 H94" stroke="#b5502f" stroke-width="2.5"/>
    <path d="M80 64 v-12" stroke="#c9963f" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="48" r="4" fill="#e8b84b"/>
    <rect x="52" y="132" width="56" height="12" fill="#cf6a46"/>
  </g>
  <g fill="#d68a5e">
    <rect x="124" y="108" width="28" height="36"/>
    <path d="M124 108 q14 -16 28 0 z" fill="#c26a44"/>
    <rect x="160" y="118" width="22" height="26"/>
  </g>

  <!-- ghat steps -->
  <g fill="#d6b48c">
    <rect y="144" width="400" height="13"/>
    <rect y="157" width="400" height="13" fill="#cba87e"/>
    <rect y="170" width="400" height="13" fill="#c09c70"/>
    <rect y="183" width="400" height="13" fill="#b59063"/>
  </g>
  <g stroke="#a07f55" stroke-width="1.5">
    <path d="M0 157 H400 M0 170 H400 M0 183 H400"/>
  </g>

  <!-- people -->
  <g fill="#3c4a63">
    <circle cx="216" cy="150" r="4"/><rect x="213" y="155" width="6" height="12" rx="3"/>
    <circle cx="240" cy="164" r="4" fill="#9c4a4a"/><rect x="237" y="169" width="6" height="12" rx="3" fill="#9c4a4a"/>
    <circle cx="332" cy="152" r="4" fill="#4a6b52"/><rect x="329" y="157" width="6" height="12" rx="3" fill="#4a6b52"/>
  </g>

  <!-- river -->
  <rect y="196" width="400" height="64" fill="url(#pRiv)"/>
  <g class="ripple" fill="#ffd79a">
    <rect x="240" y="210" width="60" height="3" rx="1.5"/>
    <rect x="258" y="224" width="80" height="3" rx="1.5"/>
    <rect x="270" y="240" width="46" height="3" rx="1.5"/>
  </g>

  <!-- boats -->
  <g class="boat">
    <path d="M40 226 q26 12 52 0 l-6 10 q-20 8 -40 0 z" fill="#5a3f2c"/>
    <path d="M66 226 V202" stroke="#5a3f2c" stroke-width="2.5"/>
    <path d="M68 204 q22 8 0 18 z" fill="#f2e2c6"/>
  </g>
  <g class="boat bt2">
    <path d="M150 244 q20 9 40 0 l-5 8 q-15 6 -30 0 z" fill="#6b4a33"/>
    <path d="M170 244 V228" stroke="#6b4a33" stroke-width="2"/>
  </g>
</svg>
