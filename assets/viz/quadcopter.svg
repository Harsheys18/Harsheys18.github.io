<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="A 500 millimetre quadcopter built from scratch: an Arduino flight controller reads the IMU and mixes pitch, roll and yaw corrections into four motor speeds, with a smartphone app standing in for a dedicated transmitter.">
  <style>
    .bg { fill: #f2f8fd; }
    .panel { fill: #ffffff; stroke: #bcdcf2; stroke-width: 1.5; }
    .lbl { font: 600 12px Inter, system-ui, sans-serif; fill: #10305c; }
    .sub { font: 500 10px Inter, system-ui, sans-serif; fill: #6e7d96; }
    .cap { font: 600 11px Inter, system-ui, sans-serif; fill: #1878b8; letter-spacing: .08em; }
    .mono { font: 600 10px "JetBrains Mono", ui-monospace, monospace; fill: #1878b8; }
    .prop { animation: spin .28s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hover { animation: hover 3.4s ease-in-out infinite; }
    @keyframes hover { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    .axp { animation: ax 4.2s ease-in-out infinite; }
    .ax2 { animation-delay: 1.4s; } .ax3 { animation-delay: 2.8s; }
    @keyframes ax { 0%,100% { opacity: .25; } 25%,40% { opacity: 1; } }
    .sig { animation: sig 2s ease-out infinite; transform-box: view-box; transform-origin: 424px 244px; }
    .s2 { animation-delay: .6s; }
    @keyframes sig { 0% { opacity: .8; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.3); } }
  </style>

  <rect class="bg" width="520" height="340" rx="10"/>
  <text class="cap" x="24" y="30">ARDUINO FLIGHT CONTROL</text>

  <rect class="panel" x="24" y="46" width="290" height="196" rx="10"/>

  <g class="hover" style="transform-box: view-box; transform-origin: 168px 144px;">
    <!-- arms -->
    <path d="M114 104 L222 184 M222 104 L114 184" stroke="#10305c" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <rect x="146" y="124" width="44" height="40" rx="8" fill="#10305c"/>
    <rect x="156" y="134" width="24" height="20" rx="4" fill="#2b95d6"/>
    <!-- props -->
    <g class="prop"><ellipse cx="114" cy="104" rx="26" ry="5" fill="#2b95d6" opacity=".75"/></g>
    <g class="prop"><ellipse cx="222" cy="104" rx="26" ry="5" fill="#2b95d6" opacity=".75"/></g>
    <g class="prop"><ellipse cx="114" cy="184" rx="26" ry="5" fill="#8ec7e9" opacity=".8"/></g>
    <g class="prop"><ellipse cx="222" cy="184" rx="26" ry="5" fill="#8ec7e9" opacity=".8"/></g>
    <circle cx="114" cy="104" r="5" fill="#071c38"/>
    <circle cx="222" cy="104" r="5" fill="#071c38"/>
    <circle cx="114" cy="184" r="5" fill="#071c38"/>
    <circle cx="222" cy="184" r="5" fill="#071c38"/>
  </g>

  <text class="sub" x="40" y="228">500 mm frame &#183; built from scratch</text>

  <!-- axes -->
  <rect class="panel" x="330" y="46" width="166" height="196" rx="10"/>
  <text class="lbl" x="346" y="70">attitude control</text>
  <g transform="translate(346,84)">
    <g class="axp">
      <path d="M0 16 h56" stroke="#2b95d6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 10 l8 6 l-8 6" fill="none" stroke="#2b95d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="sub" x="68" y="20">pitch</text>
    </g>
    <g class="axp ax2">
      <path d="M0 56 h56" stroke="#10305c" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 50 l8 6 l-8 6" fill="none" stroke="#10305c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="sub" x="68" y="60">roll</text>
    </g>
    <g class="axp ax3">
      <path d="M0 96 h56" stroke="#8ec7e9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 90 l8 6 l-8 6" fill="none" stroke="#8ec7e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="sub" x="68" y="100">yaw</text>
    </g>
    <text class="mono" x="0" y="134">IMU &#8594; mixer &#8594; 4 ESCs</text>
  </g>

  <!-- phone transmitter -->
  <rect class="panel" x="24" y="258" width="472" height="60" rx="10"/>
  <text class="sub" x="40" y="284">no dedicated transmitter &#8212; a phone app sends the setpoints over a serial link</text>
  <text class="sub" x="40" y="302">Remote XY &#183; Arduino &#183; brushless ESCs</text>
  <g transform="translate(410,268)">
    <rect x="0" y="0" width="26" height="42" rx="5" fill="#10305c"/>
    <rect x="4" y="5" width="18" height="30" rx="2" fill="#2b95d6"/>
    <circle class="sig" cx="14" cy="-24" r="14" fill="none" stroke="#2b95d6" stroke-width="2"/>
    <circle class="sig s2" cx="14" cy="-24" r="14" fill="none" stroke="#2b95d6" stroke-width="2"/>
  </g>
</svg>
