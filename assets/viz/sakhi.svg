<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Sakhi: a closed perception-to-dialogue loop running speech-to-text, facial emotion detection, LLM reasoning and expressive text-to-speech around a single real-time cycle.">
  <style>
    .bg { fill: #f2f8fd; }
    .ring { fill: none; stroke: #bcdcf2; stroke-width: 2; stroke-dasharray: 6 7; }
    .node { fill: #ffffff; stroke: #8ec7e9; stroke-width: 1.5; }
    .head { fill: #10305c; }
    .lbl { font: 600 12px Inter, system-ui, sans-serif; fill: #10305c; }
    .sub { font: 500 10px Inter, system-ui, sans-serif; fill: #6e7d96; }
    .cap { font: 600 11px Inter, system-ui, sans-serif; fill: #1878b8; letter-spacing: .08em; }
    .ic { fill: none; stroke: #2b95d6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .orbit { transform-box: view-box; transform-origin: 260px 178px; animation: spin 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { fill: #2b95d6; transform-box: view-box; transform-origin: center bottom; animation: talk 1.1s ease-in-out infinite; }
    .b2 { animation-delay: .15s; } .b3 { animation-delay: .3s; } .b4 { animation-delay: .45s; }
    @keyframes talk { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .blink { animation: blink 3.4s ease-in-out infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  </style>

  <rect class="bg" width="520" height="340" rx="10"/>
  <text class="cap" x="24" y="30">PERCEPTION &#8594; DIALOGUE LOOP</text>

  <circle class="ring" cx="260" cy="178" r="112"/>

  <!-- travelling activation -->
  <g class="orbit"><circle cx="260" cy="66" r="6" fill="#2b95d6"/></g>

  <!-- robot head at the centre -->
  <g>
    <rect class="head" x="224" y="146" width="72" height="62" rx="16"/>
    <g class="blink" style="transform-box: view-box; transform-origin: 260px 172px;">
      <circle cx="245" cy="172" r="6" fill="#8ec7e9"/>
      <circle cx="275" cy="172" r="6" fill="#8ec7e9"/>
    </g>
    <path d="M246 190 q14 10 28 0" fill="none" stroke="#2b95d6" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="256" y="130" width="8" height="14" rx="3" fill="#10305c"/>
    <circle cx="260" cy="126" r="5" fill="#2b95d6"/>
  </g>

  <!-- 1. listen -->
  <g>
    <rect class="node" x="18" y="150" width="112" height="56" rx="12"/>
    <path class="ic" d="M40 168 v10 M40 164 a6 6 0 0 1 12 0 v10 a6 6 0 0 1 -12 0 z" transform="translate(-6,-2)"/>
    <text class="lbl" x="58" y="174">Listen</text>
    <text class="sub" x="58" y="190">speech &#8594; text</text>
  </g>

  <!-- 2. see -->
  <g>
    <rect class="node" x="196" y="26" width="128" height="56" rx="12"/>
    <circle class="ic" cx="222" cy="54" r="10"/>
    <path class="ic" d="M218 57 q4 4 8 0 M219 51 h.01 M225 51 h.01"/>
    <text class="lbl" x="240" y="50">See</text>
    <text class="sub" x="240" y="66">facial emotion</text>
  </g>

  <!-- 3. reason -->
  <g>
    <rect class="node" x="390" y="150" width="112" height="56" rx="12"/>
    <path class="ic" d="M406 172 h6 m6 0 h6 M412 166 v12 M418 166 v12" />
    <circle cx="409" cy="172" r="2.5" fill="#2b95d6"/>
    <circle cx="427" cy="172" r="2.5" fill="#2b95d6"/>
    <text class="lbl" x="436" y="174">Reason</text>
    <text class="sub" x="436" y="190">LLM planner</text>
  </g>

  <!-- 4. speak -->
  <g>
    <rect class="node" x="196" y="274" width="128" height="56" rx="12"/>
    <g>
      <rect class="bar" x="216" y="292" width="4" height="20" rx="2"/>
      <rect class="bar b2" x="224" y="292" width="4" height="20" rx="2"/>
      <rect class="bar b3" x="232" y="292" width="4" height="20" rx="2"/>
      <rect class="bar b4" x="240" y="292" width="4" height="20" rx="2"/>
    </g>
    <text class="lbl" x="254" y="298">Speak</text>
    <text class="sub" x="254" y="314">expressive TTS</text>
  </g>

  <text class="sub" x="24" y="316">one agent, not four modules</text>
</svg>
