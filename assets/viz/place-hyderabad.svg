<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="An illustration of an old Deccan city at golden hour: a four-arched monument with tall minarets at the centre of a busy crossroads, granite boulders and a mosque dome behind it.">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c95c9"/><stop offset=".48" stop-color="#eec08b"/><stop offset="1" stop-color="#f6d9a8"/>
    </linearGradient>
    <linearGradient id="hStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a678"/><stop offset=".5" stop-color="#e6c898"/><stop offset="1" stop-color="#bd9a6c"/>
    </linearGradient>
  </defs>
  <style>
    .kite { animation: kite 7s ease-in-out infinite; }
    .k2 { animation-delay: 2.4s; }
    @keyframes kite { 0%,100% { transform: translate(0,0) rotate(-6deg); } 50% { transform: translate(22px,-16px) rotate(8deg); } }
    .lamp { animation: lp 3.2s ease-in-out infinite; }
    .lp2 { animation-delay: 1.1s; } .lp3 { animation-delay: 2.2s; }
    @keyframes lp { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  </style>

  <rect width="400" height="260" fill="url(#hSky)"/>
  <circle cx="332" cy="72" r="24" fill="#ffe6b8" opacity=".85"/>

  <!-- boulders -->
  <g fill="#9b8c76">
    <ellipse cx="42" cy="176" rx="40" ry="26"/>
    <ellipse cx="30" cy="150" rx="24" ry="18" fill="#ab9c84"/>
    <ellipse cx="368" cy="182" rx="36" ry="22"/>
  </g>

  <!-- mosque dome behind -->
  <g fill="#c2a97f">
    <rect x="266" y="140" width="66" height="52"/>
    <path d="M266 140 q33 -34 66 0 z" fill="#b39a70"/>
    <rect x="294" y="98" width="10" height="14" rx="5" fill="#d8bd8e"/>
  </g>

  <!-- charminar-like monument -->
  <g>
    <rect x="144" y="120" width="112" height="72" fill="url(#hStone)"/>
    <path d="M160 192 v-34 q20 -26 40 0 v34 z" fill="#8f7550"/>
    <path d="M216 192 v-26 q14 -18 28 0 v26 z" fill="#8f7550" opacity=".7"/>
    <path d="M144 120 h112 v10 h-112 z" fill="#a8895f"/>
    <path d="M150 120 q50 -22 100 0 z" fill="#d2b183"/>

    <!-- four minarets -->
    <g fill="#d2b183">
      <rect x="136" y="72" width="16" height="120" rx="3"/>
      <rect x="248" y="72" width="16" height="120" rx="3"/>
      <path d="M136 72 q8 -18 16 0 z" fill="#c9963f"/>
      <path d="M248 72 q8 -18 16 0 z" fill="#c9963f"/>
      <rect x="132" y="104" width="24" height="6" rx="2" fill="#b39a70"/>
      <rect x="244" y="104" width="24" height="6" rx="2" fill="#b39a70"/>
      <rect x="132" y="134" width="24" height="6" rx="2" fill="#b39a70"/>
      <rect x="244" y="134" width="24" height="6" rx="2" fill="#b39a70"/>
    </g>
    <circle class="lamp" cx="144" cy="62" r="3" fill="#ffd47a"/>
    <circle class="lamp lp2" cx="256" cy="62" r="3" fill="#ffd47a"/>
  </g>

  <!-- market lamps -->
  <g>
    <path d="M60 192 V150" stroke="#6b5a42" stroke-width="3"/>
    <circle class="lamp lp3" cx="60" cy="146" r="5" fill="#ffd47a"/>
    <path d="M344 192 V158" stroke="#6b5a42" stroke-width="3"/>
    <circle class="lamp" cx="344" cy="154" r="5" fill="#ffd47a"/>
  </g>

  <!-- street -->
  <rect y="192" width="400" height="68" fill="#9c8f7c"/>
  <g fill="#c4b9a6">
    <rect x="20" y="222" width="34" height="5" rx="2.5"/>
    <rect x="86" y="222" width="34" height="5" rx="2.5"/>
    <rect x="152" y="222" width="34" height="5" rx="2.5"/>
    <rect x="218" y="222" width="34" height="5" rx="2.5"/>
    <rect x="284" y="222" width="34" height="5" rx="2.5"/>
    <rect x="350" y="222" width="34" height="5" rx="2.5"/>
  </g>

  <!-- kites -->
  <g class="kite" transform="translate(74,40)">
    <path d="M0 0 L10 12 L0 24 L-10 12 z" fill="#e8705a"/>
    <path d="M0 24 q6 10 -4 16" stroke="#e8705a" stroke-width="1.5" fill="none"/>
  </g>
  <g class="kite k2" transform="translate(212,30)">
    <path d="M0 0 L8 10 L0 20 L-8 10 z" fill="#24a89b"/>
    <path d="M0 20 q-6 8 4 14" stroke="#24a89b" stroke-width="1.5" fill="none"/>
  </g>
</svg>
