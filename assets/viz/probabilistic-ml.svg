<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Three corners of probabilistic machine learning: continuous and discrete diffusion models on MNIST, loopy belief propagation for approximate inference in a factorial hidden Markov model, and Bayesian optimisation with a Gaussian process surrogate.">
  <style>
    .bg { fill: #f2f8fd; }
    .panel { fill: #ffffff; stroke: #bcdcf2; stroke-width: 1.5; }
    .lbl { font: 600 12px Inter, system-ui, sans-serif; fill: #10305c; }
    .sub { font: 500 10px Inter, system-ui, sans-serif; fill: #6e7d96; }
    .cap { font: 600 11px Inter, system-ui, sans-serif; fill: #1878b8; letter-spacing: .08em; }
    .mono { font: 600 10px "JetBrains Mono", ui-monospace, monospace; fill: #1878b8; }
    .dn { animation: dn 4s ease-in-out infinite; }
    .dn2 { animation-delay: .5s; } .dn3 { animation-delay: 1s; }
    @keyframes dn { 0%,100% { opacity: .9; } 55% { opacity: .08; } }
    .msg { animation: msg 2.6s ease-in-out infinite; }
    .m2 { animation-delay: .3s; } .m3 { animation-delay: .6s; } .m4 { animation-delay: .9s; }
    @keyframes msg { 0%,100% { opacity: .2; r: 3; } 50% { opacity: 1; r: 4.5; } }
    .probe { animation: probe 4s ease-in-out infinite; }
    @keyframes probe { 0% { transform: translateX(0); } 33% { transform: translateX(54px); } 66% { transform: translateX(22px); } 100% { transform: translateX(0); } }
    .band { animation: band 4s ease-in-out infinite; }
    @keyframes band { 0%,100% { opacity: .35; } 50% { opacity: .15; } }
  </style>
  <defs><pattern id="gr2" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#10305c" opacity=".55"/><rect x="2" y="2" width="2" height="2" fill="#10305c" opacity=".3"/></pattern></defs>

  <rect class="bg" width="520" height="340" rx="10"/>
  <text class="cap" x="24" y="30">DIFFUSION &#183; INFERENCE &#183; BAYESIAN SEARCH</text>

  <!-- diffusion -->
  <rect class="panel" x="24" y="46" width="472" height="100" rx="10"/>
  <text class="lbl" x="40" y="70">DDPM &amp; D3PM on MNIST</text>
  <g transform="translate(40,78)">
    <rect x="0" y="0" width="48" height="48" rx="5" fill="#dcecf9"/>
    <rect class="dn" x="0" y="0" width="48" height="48" rx="5" fill="url(#gr2)"/>
    <rect x="58" y="0" width="48" height="48" rx="5" fill="#dcecf9"/>
    <path d="M78 10 v28" stroke="#10305c" stroke-width="5" stroke-linecap="round"/>
    <rect class="dn dn2" x="58" y="0" width="48" height="48" rx="5" fill="url(#gr2)"/>
    <rect x="116" y="0" width="48" height="48" rx="5" fill="#dcecf9"/>
    <path d="M132 12 q14 -4 14 10 t-14 12 h14" fill="none" stroke="#10305c" stroke-width="5" stroke-linecap="round"/>
    <rect class="dn dn3" x="116" y="0" width="48" height="48" rx="5" fill="url(#gr2)"/>
    <rect x="174" y="0" width="48" height="48" rx="5" fill="#dcecf9"/>
    <path d="M190 12 v24 M190 12 q14 0 14 12 t-14 12" fill="none" stroke="#10305c" stroke-width="5" stroke-linecap="round"/>
    <text class="sub" x="238" y="20">continuous and discrete</text>
    <text class="sub" x="238" y="36">corruption processes</text>
    <text class="mono" x="238" y="52">low FID</text>
  </g>

  <!-- factorial HMM + LBP -->
  <rect class="panel" x="24" y="162" width="238" height="156" rx="10"/>
  <text class="lbl" x="40" y="186">factorial HMM &#183; loopy BP</text>
  <g transform="translate(44,200)">
    <path d="M16 16 H76 M76 16 H136 M16 60 H76 M76 60 H136 M16 16 V60 M76 16 V60 M136 16 V60 M16 60 V96 M76 60 V96 M136 60 V96" stroke="#bcdcf2" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8" fill="#ffffff" stroke="#2b95d6" stroke-width="1.5"/>
    <circle cx="76" cy="16" r="8" fill="#ffffff" stroke="#2b95d6" stroke-width="1.5"/>
    <circle cx="136" cy="16" r="8" fill="#ffffff" stroke="#2b95d6" stroke-width="1.5"/>
    <circle cx="16" cy="60" r="8" fill="#ffffff" stroke="#2b95d6" stroke-width="1.5"/>
    <circle cx="76" cy="60" r="8" fill="#ffffff" stroke="#2b95d6" stroke-width="1.5"/>
    <circle cx="136" cy="60" r="8" fill="#ffffff" stroke="#2b95d6" stroke-width="1.5"/>
    <rect x="8" y="88" width="16" height="16" rx="3" fill="#10305c"/>
    <rect x="68" y="88" width="16" height="16" rx="3" fill="#10305c"/>
    <rect x="128" y="88" width="16" height="16" rx="3" fill="#10305c"/>
    <circle class="msg" cx="46" cy="16" r="3" fill="#1878b8"/>
    <circle class="msg m2" cx="106" cy="16" r="3" fill="#1878b8"/>
    <circle class="msg m3" cx="46" cy="60" r="3" fill="#1878b8"/>
    <circle class="msg m4" cx="106" cy="60" r="3" fill="#1878b8"/>
    <text class="sub" x="0" y="118">messages passed until beliefs settle</text>
  </g>

  <!-- Bayesian optimisation -->
  <rect class="panel" x="278" y="162" width="218" height="156" rx="10"/>
  <text class="lbl" x="294" y="186">GP surrogate &#183; 6-d search</text>
  <g transform="translate(294,198)">
    <path class="band" d="M0 76 q26 -46 52 -30 t48 -34 t62 6 L162 96 L0 96 z" fill="#8ec7e9"/>
    <path d="M0 62 q26 -38 52 -24 t48 -28 t62 4" fill="none" stroke="#1878b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="26" cy="48" r="4" fill="#10305c"/>
    <circle cx="78" cy="30" r="4" fill="#10305c"/>
    <circle cx="140" cy="18" r="4" fill="#10305c"/>
    <g class="probe"><path d="M52 8 v84" stroke="#e0a12b" stroke-width="2" stroke-dasharray="4 4"/><circle cx="52" cy="8" r="4" fill="#e0a12b"/></g>
    <text class="sub" x="0" y="116">acquisition picks the next trial</text>
  </g>
</svg>
