<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="An end-to-end Sudoku solver: OpenCV extracts and warps the grid from a photograph, a CNN trained on MNIST classifies each extracted digit despite the extraction noise, and A-star guided backtracking fills the rest of the board.">
  <style>
    .bg { fill: #f2f8fd; }
    .panel { fill: #ffffff; stroke: #bcdcf2; stroke-width: 1.5; }
    .lbl { font: 600 12px Inter, system-ui, sans-serif; fill: #10305c; }
    .sub { font: 500 10px Inter, system-ui, sans-serif; fill: #6e7d96; }
    .cap { font: 600 11px Inter, system-ui, sans-serif; fill: #1878b8; letter-spacing: .08em; }
    .given { font: 600 13px "JetBrains Mono", ui-monospace, monospace; fill: #10305c; }
    .solved { font: 600 13px "JetBrains Mono", ui-monospace, monospace; fill: #2b95d6; }
    .fillin { animation: fill 5s ease-in-out infinite; }
    .i1 { animation-delay: .3s; } .i2 { animation-delay: .7s; } .i3 { animation-delay: 1.1s; }
    .i4 { animation-delay: 1.5s; } .i5 { animation-delay: 1.9s; } .i6 { animation-delay: 2.3s; }
    @keyframes fill { 0%,6% { opacity: 0; } 14%,88% { opacity: 1; } 100% { opacity: 0; } }
    .warp { animation: warp 5s ease-in-out infinite; }
    @keyframes warp { 0%,100% { opacity: 1; } 30%,80% { opacity: 0; } }
    .conf { animation: conf 5s ease-in-out infinite; transform-box: view-box; transform-origin: left center; }
    @keyframes conf { 0%,10% { transform: scaleX(.1); } 30%,100% { transform: scaleX(1); } }
  </style>

  <rect class="bg" width="520" height="340" rx="10"/>
  <text class="cap" x="24" y="30">PHOTO &#8594; DIGITS &#8594; SOLUTION</text>

  <!-- photo / grid -->
  <rect class="panel" x="24" y="46" width="212" height="212" rx="10"/>
  <g class="warp">
    <path d="M44 74 L212 62 L222 232 L38 222 z" fill="none" stroke="#e0a12b" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="sub" x="44" y="60" fill="#b57f14">detect + warp</text>
  </g>
  <g transform="translate(46,68)">
    <rect x="0" y="0" width="168" height="168" fill="#ffffff" stroke="#10305c" stroke-width="2"/>
    <g stroke="#dcecf9" stroke-width="1">
      <path d="M18.6 0 V168 M37.3 0 V168 M74.6 0 V168 M93.3 0 V168 M130.6 0 V168 M149.3 0 V168"/>
      <path d="M0 18.6 H168 M0 37.3 H168 M0 74.6 H168 M0 93.3 H168 M0 130.6 H168 M0 149.3 H168"/>
    </g>
    <g stroke="#10305c" stroke-width="1.8">
      <path d="M56 0 V168 M112 0 V168 M0 56 H168 M0 112 H168"/>
    </g>
    <text class="given" x="5" y="15">5</text>
    <text class="given" x="61" y="34">7</text>
    <text class="given" x="117" y="15">1</text>
    <text class="given" x="24" y="71">9</text>
    <text class="given" x="136" y="90">3</text>
    <text class="given" x="5" y="127">4</text>
    <text class="given" x="80" y="146">8</text>
    <text class="given" x="155" y="165">2</text>
    <text class="solved fillin" x="24" y="15">3</text>
    <text class="solved fillin i1" x="80" y="34">6</text>
    <text class="solved fillin i2" x="136" y="52">4</text>
    <text class="solved fillin i3" x="43" y="90">8</text>
    <text class="solved fillin i4" x="99" y="109">5</text>
    <text class="solved fillin i5" x="5" y="146">1</text>
    <text class="solved fillin i6" x="117" y="165">7</text>
  </g>

  <!-- CNN -->
  <rect class="panel" x="252" y="46" width="244" height="112" rx="10"/>
  <text class="lbl" x="268" y="70">CNN digit classifier</text>
  <g transform="translate(268,80)">
    <rect x="0" y="0" width="34" height="34" rx="4" fill="#dcecf9"/>
    <path d="M17 6 q10 0 10 9 t-10 9 h10" fill="none" stroke="#10305c" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 17 h18" stroke="#8ec7e9" stroke-width="2"/>
    <rect x="66" y="4" width="10" height="26" rx="2" fill="#2b95d6" opacity=".55"/>
    <rect x="80" y="4" width="10" height="26" rx="2" fill="#2b95d6" opacity=".75"/>
    <rect x="94" y="4" width="10" height="26" rx="2" fill="#2b95d6"/>
    <path d="M110 17 h16" stroke="#8ec7e9" stroke-width="2"/>
    <rect x="132" y="10" width="72" height="12" rx="6" fill="#eef7fd" stroke="#bcdcf2"/>
    <rect class="conf" x="132" y="10" width="72" height="12" rx="6" fill="#2b95d6"/>
    <text class="sub" x="0" y="52">trained on MNIST &#8212; then asked to read noisy OpenCV crops</text>
  </g>

  <!-- search -->
  <rect class="panel" x="252" y="174" width="244" height="144" rx="10"/>
  <text class="lbl" x="268" y="198">A*-guided backtracking</text>
  <g transform="translate(276,210)">
    <path d="M96 10 L48 46 M96 10 L144 46 M48 46 L20 86 M48 46 L76 86 M144 46 L172 86" stroke="#bcdcf2" stroke-width="1.5"/>
    <circle cx="96" cy="10" r="8" fill="#10305c"/>
    <circle cx="48" cy="46" r="7" fill="#2b95d6"/>
    <circle cx="144" cy="46" r="7" fill="#dcecf9" stroke="#bcdcf2"/>
    <circle cx="20" cy="86" r="6" fill="#dcecf9" stroke="#bcdcf2"/>
    <circle cx="76" cy="86" r="6" fill="#2b95d6"/>
    <circle cx="172" cy="86" r="6" fill="#dcecf9" stroke="#bcdcf2"/>
    <path d="M144 46 l-8 -8 m0 8 l8 -8" stroke="#e8705a" stroke-width="2" stroke-linecap="round"/>
    <text class="sub" x="0" y="112">prune dead branches, expand the most constrained cell first</text>
  </g>
</svg>
