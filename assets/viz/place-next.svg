<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="An illustration of a folded map with a compass rose, a dotted route and a pin marking a destination that has not been chosen yet.">
  <defs>
    <linearGradient id="nSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff0fb"/><stop offset="1" stop-color="#c9e4f6"/>
    </linearGradient>
  </defs>
  <style>
    .needle { animation: nd 6s ease-in-out infinite; transform-box: view-box; transform-origin: 300px 82px; }
    @keyframes nd { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(22deg); } }
    .route { stroke-dasharray: 6 8; animation: rt 2.4s linear infinite; }
    @keyframes rt { to { stroke-dashoffset: -28; } }
    .pin { animation: bob 2.6s ease-in-out infinite; transform-box: view-box; transform-origin: 268px 196px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .pulse { animation: pl 2.6s ease-out infinite; transform-box: view-box; transform-origin: 268px 200px; }
    @keyframes pl { 0% { opacity: .6; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.5); } }
  </style>

  <rect width="400" height="260" fill="url(#nSky)"/>

  <!-- folded map -->
  <path d="M20 44 L140 26 L260 52 L380 30 L380 222 L260 244 L140 218 L20 238 z" fill="#ffffff" stroke="#bcdcf2" stroke-width="2" stroke-linejoin="round"/>
  <path d="M140 26 V218 M260 52 V244" stroke="#dcecf9" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- landmasses -->
  <path d="M46 96 q40 -26 76 -6 t52 30 q-18 34 -60 30 t-68 -54 z" fill="#dff1e6" stroke="#a9d8bf" stroke-width="1.5"/>
  <path d="M212 132 q38 -22 74 4 t62 12 q-22 38 -74 34 t-62 -50 z" fill="#fdf0dc" stroke="#e6cfa4" stroke-width="1.5"/>

  <!-- water lines -->
  <g stroke="#bcdcf2" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M44 184 q24 -8 48 0 t48 0"/>
    <path d="M210 200 q24 -8 48 0 t48 0"/>
    <path d="M232 76 q22 -8 44 0"/>
  </g>

  <!-- compass -->
  <g>
    <circle cx="300" cy="82" r="26" fill="#ffffff" stroke="#8ec7e9" stroke-width="2"/>
    <g class="needle">
      <path d="M300 62 L306 82 L300 102 L294 82 z" fill="#2b95d6"/>
      <path d="M300 62 L306 82 L294 82 z" fill="#10305c"/>
    </g>
    <circle cx="300" cy="82" r="3" fill="#10305c"/>
    <text x="296" y="54" font-size="10" font-weight="700" fill="#10305c" font-family="Inter, system-ui, sans-serif">N</text>
  </g>

  <!-- route -->
  <path class="route" d="M92 150 q46 -34 88 -6 t84 42" fill="none" stroke="#1878b8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="92" cy="150" r="5" fill="#10305c"/>

  <!-- pin -->
  <g class="pulse"><circle cx="268" cy="200" r="16" fill="#2b95d6"/></g>
  <g class="pin">
    <path d="M268 172 a14 14 0 0 1 14 14 c0 10 -14 24 -14 24 s-14 -14 -14 -24 a14 14 0 0 1 14 -14 z" fill="#e8705a"/>
    <circle cx="268" cy="186" r="5" fill="#ffffff"/>
  </g>

  <text x="40" y="230" font-size="12" font-weight="600" fill="#10305c" font-family="Inter, system-ui, sans-serif">somewhere next</text>
</svg>
